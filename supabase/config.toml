# DogPack's Supabase project. The same file configures the local stack
# (`supabase start`) and, through `supabase config push` in the deploy, the
# hosted project. Anything a section here does not name keeps the CLI's
# default, so a setting that matters is written down.
#
# Sign-in is "Sign in with DevDogs" only (the custom:devdogsuga OIDC provider,
# registered by `devtools oauth` locally and by the deploy on the hosted
# project; hosted Supabase has no config-file field for custom providers).
# Email, phone and anonymous sign-in are off.

project_id = "dogpack"

[api]
enabled = true
port = 54321
# The app's schema first: PostgREST serves the FIRST schema as the default
# profile, which is the one supadart reads. `private` and `moderation` are
# deliberately not exposed (helpers, triggers and the moderation receiver).
schemas = ["dogpack", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
# No seed. Nothing is seeded in production, and development data comes from
# `devtools dev-data`, which signs in as a real (test) account first.
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "dev.dogpack://login-callback"
additional_redirect_urls = ["dev.dogpack://login-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# The platform signs its moderation deliveries; the signature is the
# authentication, so the gateway's JWT check is off for this function.
[functions.platform-moderation]
enabled = true
verify_jwt = false
entrypoint = "./functions/platform-moderation/index.ts"

# `report` and `enroll` take the member's own session. The gateway's JWT check
# is off for them too: it predates the project's asymmetric signing keys and
# the new API keys, and each function verifies the session itself with
# `auth.getUser(jwt)` before it does anything.
[functions.report]
enabled = true
verify_jwt = false
entrypoint = "./functions/report/index.ts"

[functions.enroll]
enabled = true
verify_jwt = false
entrypoint = "./functions/enroll/index.ts"

[experimental.pgdelta]
enabled = true
