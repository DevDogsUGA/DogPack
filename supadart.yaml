# supadart config: generates Dart models from the Supabase schema
# (`supabase gen types` has no Dart target). Run by `devtools db types`, by
# CI, or by hand with the local stack's URL and SECRET key:
#
#   SUPABASE_URL=... SUPABASE_API_KEY=... dart run supadart
#
# supadart 2.x reads the schema named under `schemas:` below (an
# `Accept-Profile` header), and reads the Postgres enums (`classYear`,
# `sessionStatus`) from the database. 1.x could only read the default `public`
# schema and generated `String.values.byName(...)` for enums outside it, which
# does not compile; do not go back to 1.x. The schema must stay exposed under
# `[api] schemas` in supabase/config.toml.
#
# The SECRET (service) key is required: supadart 401s on the publishable key
# when it fetches the spec. It is a tooling credential and never a
# `--dart-define`.
#
# With no tables in the schema this is a no-op.

schemas: [dogpack]

output: lib/generated/
separated: true
