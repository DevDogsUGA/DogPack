name: Set up Flutter
description: The Flutter version from pubspec.yaml on PATH, with the pub cache restored.

runs:
  using: composite
  steps:
    # Not subosito/flutter-action: it calls `actions/cache@v5` internally, by
    # tag, and a repository that requires every action pinned to a full commit
    # SHA fails the job before it runs a step. Clone the exact version declared
    # in pubspec.yaml instead.
    - name: Install Flutter from pubspec.yaml
      shell: bash
      run: |
        version="$(ruby -ryaml -e '
          version = YAML.load_file("pubspec.yaml").dig("environment", "flutter")
          unless version.is_a?(String) && /\A[0-9]+\.[0-9]+\.[0-9]+\z/.match?(version)
            abort "::error::pubspec.yaml environment.flutter must be an exact X.Y.Z version"
          end
          puts version
        ')"
        git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
        echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
    - name: Restore the pub cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
        restore-keys: pub-${{ runner.os }}-
    - name: Flutter version
      shell: bash
      run: flutter --version
