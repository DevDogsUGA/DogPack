analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    # Generated by supadart, and git-ignored. Its enum columns currently generate
    # `String.values.byName(...)`, which doesn't analyze; until supadart.yaml maps
    # the enums, keep the generated code out of members' `flutter analyze`.
    - lib/generated/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
