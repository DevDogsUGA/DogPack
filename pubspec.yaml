name: dogpack
description: DogPack, the DevDogs study-group app for UGA students (Flutter, Android and iOS).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # The club's brand, "Sign in with DevDogs", env reader and telemetry. A
  # prerelease until the stable 0.1.0 is published; then change to ^0.1.0.
  devdogsuga_sdk: ^0.1.0-next.1
  flutter_svg: ^2.0.10
  go_router: ^14.6.0
  provider: ^6.1.2
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Dart model generation from the Supabase schema (`supabase gen types` has no
  # Dart target). Run by `devtools db types` and by CI; see docs/guides/typed-models.md.
  supadart: ^1.9.3

flutter:
  uses-material-design: true
  # The brand fonts and mark ship inside devdogsuga_sdk; a package cannot
  # bundle fonts for an app that did not ask, so they are listed here.
  fonts:
    - family: Hanken Grotesk
      fonts:
        - asset: packages/devdogsuga_sdk/assets/fonts/HankenGrotesk-400.ttf
        - asset: packages/devdogsuga_sdk/assets/fonts/HankenGrotesk-700.ttf
          weight: 700
    - family: Alan Sans
      fonts:
        - asset: packages/devdogsuga_sdk/assets/fonts/AlanSans-800.ttf
          weight: 800
  assets:
    - packages/devdogsuga_sdk/assets/brand/dogpack.svg
